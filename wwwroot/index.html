<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClaimFlow</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            background: #f0f2f5;
            font-family: sans-serif;
            color: #222;
        }

        h1 {
            margin: 0 0 4px 0;
            font-size: 24px;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin: 0 0 20px 0;
        }

        .status {
            padding: 10px 14px;
            border-radius: 6px;
            font-size: 13px;
            margin-bottom: 24px;
            background: #fff;
            border: 1px solid #ddd;
            color: #888;
        }

        .status.active {
            background: #edf7ee;
            border-color: #81c784;
            color: #2e7d32;
        }

        .cards {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            width: 300px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }

        .card.locked {
            opacity: 0.45;
            pointer-events: none;
        }

        .card h2 {
            margin: 0 0 16px 0;
            font-size: 16px;
            font-weight: 600;
        }

        label {
            display: block;
            font-size: 12px;
            color: #555;
            margin: 10px 0 3px 0;
        }

        input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }

        input:focus {
            outline: none;
            border-color: #1a73e8;
        }

        button {
            margin-top: 16px;
            width: 100%;
            padding: 9px;
            background: #1a73e8;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 13px;
            cursor: pointer;
        }

        button:hover {
            background: #1558b0;
        }

        .response-box {
            display: none;
            margin-top: 12px;
            padding: 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 160px;
            overflow-y: auto;
            border: 1px solid #e0e0e0;
            background: #f8f8f8;
        }

        .response-box.ok {
            background: #edf7ee;
            border-color: #81c784;
            color: #1b5e20;
        }

        .response-box.fail {
            background: #fdecea;
            border-color: #e57373;
            color: #b71c1c;
        }
    </style>
</head>
<body>

    <h1>ClaimFlow</h1>

    <div id="statusBar" class="status">Not logged in</div>

    <div class="cards">

        <div class="card">
            <h2>Register</h2>
            <form id="registerForm">
                <label>First Name</label>
                <input type="text" id="r_first" placeholder="Jane" />

                <label>Last Name</label>
                <input type="text" id="r_last" placeholder="Smith" />

                <label>Email</label>
                <input type="email" id="r_email" placeholder="jane@example.com" />

                <label>Password</label>
                <input type="password" id="r_password" />

                <label>Date of Birth</label>
                <input type="date" id="r_dob" />

                <label>Phone</label>
                <input type="tel" id="r_phone" placeholder="07700 900000" />

                <button type="submit">Create Account</button>
            </form>
            <div id="registerResponse" class="response-box"></div>
        </div>

        <div class="card">
            <h2>Login</h2>
            <form id="loginForm">
                <label>Email</label>
                <input type="email" id="l_email" placeholder="jane@example.com" />

                <label>Password</label>
                <input type="password" id="l_password" />

                <button type="submit">Login</button>
            </form>
            <div id="loginResponse" class="response-box"></div>
        </div>

        <div class="card locked" id="quoteCard">
            <h2>Request a Quote</h2>
            <form id="quoteForm">
                <label>Destination</label>
                <input type="text" id="q_dest" placeholder="Japan" />

                <label>Start Date</label>
                <input type="date" id="q_start" />

                <label>End Date</label>
                <input type="date" id="q_end" />

                <label>Trip Cost (£)</label>
                <input type="number" id="q_cost" placeholder="2500" step="0.01" min="0" />

                <label>Number of Travelers</label>
                <input type="number" id="q_travelers" placeholder="2" min="1" />

                <button type="submit">Get Quote</button>
            </form>
            <div id="quoteResponse" class="response-box"></div>
        </div>

    </div>

    <script>
        var token = null;

        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var body = {
                firstName: document.getElementById('r_first').value,
                lastName: document.getElementById('r_last').value,
                email: document.getElementById('r_email').value,
                password: document.getElementById('r_password').value,
                dateOfBirth: (document.getElementById('r_dob').value || '0001-01-01') + 'T00:00:00',
                phone: document.getElementById('r_phone').value
            };

            var box = document.getElementById('registerResponse');

            try {
                var res = await fetch('/api/customers/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });

                var data = await res.json();
                box.textContent = JSON.stringify(data, null, 2);
                box.className = 'response-box ' + (res.ok ? 'ok' : 'fail');
                box.style.display = 'block';
            } catch (err) {
                box.textContent = err.message;
                box.className = 'response-box fail';
                box.style.display = 'block';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var loginBody = {
                email: document.getElementById('l_email').value,
                password: document.getElementById('l_password').value
            };

            var loginBox = document.getElementById('loginResponse');

            try {
                var loginRes = await fetch('/api/customers/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginBody)
                });

                var loginData = await loginRes.json();
                loginBox.textContent = JSON.stringify(loginData, null, 2);
                loginBox.className = 'response-box ' + (loginRes.ok ? 'ok' : 'fail');
                loginBox.style.display = 'block';

                if (loginRes.ok && loginData.token) {
                    token = loginData.token;

                    var statusEl = document.getElementById('statusBar');
                    statusEl.textContent = 'Logged in as ' + loginData.name;
                    statusEl.classList.add('active');

                    document.getElementById('quoteCard').classList.remove('locked');
                }
            } catch (err) {
                loginBox.textContent = err.message;
                loginBox.className = 'response-box fail';
                loginBox.style.display = 'block';
            }
        });

        document.getElementById('quoteForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            var quoteBody = {
                destination: document.getElementById('q_dest').value,
                startDate: (document.getElementById('q_start').value || '0001-01-01') + 'T00:00:00',
                endDate: (document.getElementById('q_end').value || '0001-01-01') + 'T00:00:00',
                tripCost: parseFloat(document.getElementById('q_cost').value),
                numberOfTravelers: parseInt(document.getElementById('q_travelers').value)
            };

            var authHeader = 'Bearer ' + token;
            var box = document.getElementById('quoteResponse');

            try {
                var resp = await fetch('/api/quotes', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': authHeader
                    },
                    body: JSON.stringify(quoteBody)
                });

                var data = await resp.json();
                box.textContent = JSON.stringify(data, null, 2);
                box.className = 'response-box ' + (resp.ok ? 'ok' : 'fail');
                box.style.display = 'block';
            } catch (err) {
                box.textContent = err.message;
                box.className = 'response-box fail';
                box.style.display = 'block';
            }
        });
    </script>

</body>
</html>
